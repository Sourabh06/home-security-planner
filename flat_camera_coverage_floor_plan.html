<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Flat camera coverage floor plan</title>
<style>
:root{
  --bg:#f9f9f7;
  --surface-1:#fcfcfb;
  --surface-2:#ffffff;
  --text-primary:#0b0b0b;
  --text-secondary:#52514e;
  --text-muted:#898781;
  --border:rgba(11,11,11,.10);
  --border-strong:rgba(11,11,11,.20);
  --accent:#2a78d6;
  --accent-bg:rgba(42,120,214,.14);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b0b0b;
    --surface-1:#1a1a19;
    --surface-2:#242423;
    --text-primary:#f0efec;
    --text-secondary:#c3c2b7;
    --text-muted:#898781;
    --border:rgba(255,255,255,.12);
    --border-strong:rgba(255,255,255,.25);
    --accent:#6da7ec;
    --accent-bg:rgba(109,167,236,.2);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text-primary);
  padding:16px;
  padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));
  padding-bottom:max(16px,env(safe-area-inset-bottom));
}
main{max-width:900px;margin:0 auto}
h1{font-size:1.25rem;font-weight:600;margin-bottom:12px;line-height:1.3}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Switch between example and own plan */
.switch{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:12px;
  background:var(--surface-1);border:1px solid var(--border-strong);border-radius:12px;
}
.switch button{
  min-height:44px;border:0;border-radius:8px;background:transparent;
  font-size:15px;font-weight:500;color:var(--text-secondary);cursor:pointer;
}
.switch button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* Example plan */
#plan{display:block;width:100%;height:auto;max-width:100%}
#plan .ts{font-size:12px;fill:var(--text-secondary)}
#plan .th{font-size:14px;fill:var(--text-primary);font-weight:500}
#plan .muted{fill:var(--text-muted)}

#toggles{display:flex;flex-wrap:wrap;gap:4px 18px;margin:12px 0 4px;font-size:14px}
.check{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  min-height:44px;padding:4px 0;font-size:14px;
}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}

.cta{
  display:block;width:100%;min-height:48px;margin-top:12px;
  border:0;border-radius:10px;background:var(--accent);color:#fff;
  font-size:16px;font-weight:600;cursor:pointer;
}

/* Custom canvas */
.tools,.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.tools button,.actions button{
  min-height:44px;padding:4px 2px;border:1px solid var(--border-strong);border-radius:8px;
  background:var(--surface-1);font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.tools button[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.actions button:disabled{opacity:.4;cursor:default}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid var(--text-primary)}
.hint{font-size:13px;color:var(--text-secondary);min-height:2.6em;margin:2px 0 6px;line-height:1.3}
#textbar{display:flex;gap:6px;margin-bottom:8px}
#textbar input{
  flex:1;min-width:0;height:44px;padding:8px 12px;font-size:16px;
  background:var(--surface-2);color:var(--text-primary);
  border:1px solid var(--border-strong);border-radius:8px;
}
#textbar button{min-height:44px;padding:0 14px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface-1);cursor:pointer}
#textbar #textAdd{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
#canvas{
  display:block;width:100%;height:62vh;height:62dvh;min-height:300px;max-height:640px;
  background:var(--surface-1);border:1px solid var(--border-strong);border-radius:10px;
  touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
}
#canvas text{font-family:inherit}

/* Shared controls */
.sliders{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  gap:8px 12px;margin:8px 0;font-size:14px;color:var(--text-secondary);
}
.sliders output{min-width:44px;text-align:right}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:44px;
  background:transparent;touch-action:pan-y;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--border-strong)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--border-strong)}
input[type=range]:disabled{opacity:.4;cursor:default}
.tools button:disabled{opacity:.4;cursor:default}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;
  margin-top:-11px;background:var(--surface-2);border:1px solid var(--border-strong);
  box-shadow:0 1px 3px rgba(0,0,0,.25);
}
input[type=range]::-moz-range-thumb{
  width:24px;height:24px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--border-strong);
}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--text-secondary);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}

@media (max-width:640px){
  body{padding:12px}
  h1{font-size:1.1rem}
  #plan .ts{font-size:17px}
  #plan .th{font-size:17px}
  .sliders{font-size:15px;gap:2px 10px}
}
@media (max-width:380px){
  #plan .ts{font-size:19px}
  #plan .th{font-size:19px}
}
</style>
</head>
<body>
<main>
<h1>Flat camera coverage</h1>

<div class="switch" role="group" aria-label="Choose plan">
  <button type="button" id="swExample" aria-pressed="true">Example plan</button>
  <button type="button" id="swCustom" aria-pressed="false">Your plan</button>
</div>

<!-- ============ EXAMPLE VIEW ============ -->
<section id="viewExample">
<svg viewBox="0 0 680 450" role="img" id="plan" aria-labelledby="plan-title plan-desc">
<title id="plan-title">Flat floor plan with camera coverage</title>
<desc id="plan-desc">Top-down plan with a living room, kitchen, bedroom, entry foyer, balcony and shared corridor. Cones show what each camera sees.</desc>
<defs>
<clipPath id="clipIn"><rect x="60" y="40" width="460" height="320"/></clipPath>
<clipPath id="clipBal"><rect x="520" y="60" width="100" height="140"/></clipPath>
<clipPath id="clipCor"><rect x="40" y="360" width="300" height="50"/></clipPath>
</defs>

<rect x="40" y="360" width="300" height="50" fill="var(--surface-1)" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="50" y="402">Shared corridor</text>
<rect x="520" y="60" width="100" height="140" fill="var(--surface-1)" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="570" y="190" text-anchor="middle">Balcony</text>

<rect x="60" y="40" width="280" height="210" fill="var(--surface-2)" stroke="var(--border-strong)" stroke-width="1.5"/>
<rect x="340" y="40" width="180" height="160" fill="var(--surface-2)" stroke="var(--border-strong)" stroke-width="1.5"/>
<rect x="340" y="200" width="180" height="160" fill="var(--surface-2)" stroke="var(--border-strong)" stroke-width="1.5"/>
<rect x="60" y="250" width="280" height="110" fill="var(--surface-2)" stroke="var(--border-strong)" stroke-width="1.5"/>

<text class="ts" x="200" y="150" text-anchor="middle">Living room</text>
<text class="ts" x="430" y="120" text-anchor="middle">Kitchen</text>
<text class="ts" x="430" y="275" text-anchor="middle">Bedroom</text>
<text class="ts" x="430" y="297" text-anchor="middle">no camera, privacy</text>
<text class="ts" x="250" y="340" text-anchor="middle">Entry foyer</text>

<line x1="140" y1="360" x2="180" y2="360" stroke="var(--text-primary)" stroke-width="4"/>
<text class="ts" x="160" y="380" text-anchor="middle">Main door</text>
<line x1="520" y1="110" x2="520" y2="150" stroke="var(--text-secondary)" stroke-width="3"/>
<line x1="46" y1="362" x2="46" y2="380" stroke="var(--text-muted)" stroke-width="3"/>
<text class="ts muted" x="50" y="432">Neighbour</text>
<line x1="334" y1="362" x2="334" y2="380" stroke="var(--text-muted)" stroke-width="3"/>
<text class="ts muted" x="270" y="432">Neighbour</text>

<g id="cones"></g>
<g id="pins"></g>
</svg>
<div id="toggles"></div>
<button type="button" class="cta" id="tryBtn">Try out your floor plan</button>
</section>

<!-- ============ CUSTOM VIEW ============ -->
<section id="viewCustom" hidden>
  <div class="tools" role="group" aria-label="Tools">
    <button type="button" data-tool="line" aria-pressed="true">Line</button>
    <button type="button" data-tool="text" aria-pressed="false">Text</button>
    <button type="button" data-tool="in" aria-pressed="false"><span class="dot" style="background:#1D9E75"></span>Indoor</button>
    <button type="button" data-tool="out" aria-pressed="false"><span class="dot" style="background:#EF9F27"></span>Outdoor</button>
    <button type="button" data-tool="aim" aria-pressed="false">Aim</button>
    <button type="button" data-tool="erase" aria-pressed="false">Erase</button>
    <button type="button" data-tool="pan" aria-pressed="false">Pan</button>
    <button type="button" data-tool="suggest" aria-pressed="false"><span style="text-align:center;line-height:1.15">Suggest<small style="display:block;font-size:10px;opacity:.8">(experimental)</small></span></button>
  </div>
  <div class="actions">
    <button type="button" id="btnUndo" disabled>Undo</button>
    <button type="button" id="btnRedo" disabled>Redo</button>
    <button type="button" id="btnClear" disabled>Clear all</button>
    <button type="button" id="btnFit">Reset view</button>
  </div>
  <div class="actions" style="grid-template-columns:repeat(2,1fr)">
    <button type="button" id="btnSave">Save plan</button>
    <button type="button" id="btnLoad">Load plan</button>
  </div>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
  <p class="hint" id="status" aria-live="polite" style="min-height:0;color:var(--accent)"></p>
  <p class="hint" id="hint" aria-live="polite"></p>
  <div id="sugbar" hidden>
    <p class="hint" style="min-height:0;font-weight:600">Suggest (experimental): placements are a starting point and can be wrong. Check each camera.</p>
    <p class="hint" id="sugMsg" aria-live="polite" style="min-height:0"></p>
    <div class="actions" style="grid-template-columns:repeat(2,1fr)">
      <button type="button" id="sugPlace" disabled>Place all (0)</button>
      <button type="button" id="sugClear" disabled>Clear marks</button>
    </div>
  </div>
  <div id="textbar" hidden>
    <input type="text" id="textInput" maxlength="40" placeholder="Type a label" autocomplete="off" aria-label="Label text">
    <button type="button" id="textAdd">Add</button>
    <button type="button" id="textCancel">Cancel</button>
  </div>

  <svg id="canvas" role="img" aria-label="Drawing canvas with dotted grid">
    <defs>
      <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="0" cy="0" r="1.3" fill="var(--text-muted)"/>
      </pattern>
    </defs>
    <g id="world">
      <rect x="0" y="0" width="520" height="520" fill="var(--surface-2)" stroke="var(--border-strong)" stroke-width="1.5"/>
      <rect x="-1" y="-1" width="522" height="522" fill="url(#dots)"/>
      <g id="cZones"></g>
      <g id="cCones"></g>
      <g id="cLines"></g>
      <g id="cTexts"></g>
      <g id="cPins"></g>
      <g id="cSug"></g>
      <g id="cDraft"></g>
    </g>
  </svg>

  <label class="check" style="margin-top:8px"><input type="checkbox" id="showCones"> Show coverage cones</label>
</section>

<!-- ============ SHARED ============ -->
<div class="sliders">
  <label for="fov">Field of view</label>
  <input type="range" id="fov" min="60" max="130" step="5" value="100">
  <output id="fovo" for="fov">100°</output>
  <label for="rng">Range</label>
  <input type="range" id="rng" min="60" max="160" step="5" value="100">
  <output id="rngo" for="rng">100%</output>
</div>

<div class="legend">
  <span><i style="background:#1D9E75"></i>Indoor</span>
  <span><i style="background:#EF9F27"></i>Outdoor</span>
</div>
</main>

<script>
(function(){
var NS='http://www.w3.org/2000/svg';
var IN='#1D9E75',OUT='#EF9F27';
function $(id){return document.getElementById(id);}
function mk(name,attrs){
  var e=document.createElementNS(NS,name);
  for(var k in attrs)e.setAttribute(k,attrs[k]);
  return e;
}
function conePath(x,y,a,r,f){
  var a1=(a-f/2)*Math.PI/180,a2=(a+f/2)*Math.PI/180,
      x1=x+r*Math.cos(a1),y1=y+r*Math.sin(a1),
      x2=x+r*Math.cos(a2),y2=y+r*Math.sin(a2);
  return 'M'+x+' '+y+' L'+x1.toFixed(1)+' '+y1.toFixed(1)+' A'+r.toFixed(1)+' '+r.toFixed(1)+' 0 '+(f>180?1:0)+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' Z';
}
function fovVal(){return +$('fov').value;}
function rngScale(){return +$('rng').value/100;}

/* ================= EXAMPLE ================= */
var cams=[
{n:'1',name:'Door camera or doorbell',x:160,y:364,a:90,r:55,clip:'clipCor',c:OUT,on:true},
{n:'2',name:'Entry foyer',x:68,y:258,a:48,r:150,clip:'clipIn',c:IN,on:true},
{n:'3',name:'Living room',x:68,y:48,a:40,r:230,clip:'clipIn',c:IN,on:true},
{n:'4',name:'Balcony',x:612,y:68,a:135,r:120,clip:'clipBal',c:OUT,on:true}
];
function drawExample(){
  var g=$('cones');g.innerHTML='';
  var f=fovVal(),s=rngScale();
  cams.forEach(function(c){
    if(!c.on)return;
    var p=mk('path',{d:conePath(c.x,c.y,c.a,c.r*s,f),fill:c.c,'fill-opacity':'0.28',stroke:c.c,'stroke-width':'0.8','clip-path':'url(#'+c.clip+')'});
    g.appendChild(p);
  });
}
function buildExample(){
  var g=$('pins');
  cams.forEach(function(c){
    var e=mk('g',{});
    e.appendChild(mk('circle',{cx:c.x,cy:c.y,r:11,fill:c.c,stroke:'var(--text-primary)','stroke-width':'0.8'}));
    var t=mk('text',{class:'th',x:c.x,y:c.y,'text-anchor':'middle','dominant-baseline':'central',fill:'#04342C',style:'font-size:14px'});
    t.textContent=c.n;
    e.appendChild(t);
    g.appendChild(e);
  });
  var tg=$('toggles');
  cams.forEach(function(c){
    var l=document.createElement('label');l.className='check';
    var cb=document.createElement('input');cb.type='checkbox';cb.checked=true;
    cb.onchange=function(){c.on=this.checked;drawExample();};
    l.appendChild(cb);
    l.appendChild(document.createTextNode(c.n+'. '+c.name));
    tg.appendChild(l);
  });
}

/* SUG-CORE-START */
/* Camera suggestion core for the 2D floor plan tool (v2).
   Pure functions, no DOM. ES5 style to match flat_camera_coverage_floor_plan.html.
   Meant to be pasted inline inside the page's IIFE (the site stays a set of static files). */
var Sug=(function(){
var W=520,H=520,C=5,N=Math.ceil(W/C);          // 5-unit raster: 104 x 104 cells
var EPS=1e-6,MIN_CELLS=12,MAX_ROOM=3;

function cellOf(v){return Math.min(N-1,Math.max(0,Math.floor(v/C)));}
function cellIdx(x,y){return cellOf(y)*N+cellOf(x);}

/* Walls onto the raster. Samples every C/2 units, so consecutive cells are 8-connected. */
function rasterize(lines){
  var g=new Uint8Array(N*N),i,k,l,dx,dy,len,n,t;
  for(i=0;i<lines.length;i++){
    l=lines[i];dx=l.x2-l.x1;dy=l.y2-l.y1;len=Math.hypot(dx,dy);
    n=Math.max(1,Math.ceil(len/(C/2)));
    for(k=0;k<=n;k++){t=k/n;g[cellIdx(l.x1+dx*t,l.y1+dy*t)]=1;}
  }
  return g;
}

/* 4-connected flood fill of the free cells. A region touching the raster edge is "open" (outside). */
function label(g){
  var reg=new Int16Array(N*N),regions=[],q=new Int32Array(N*N),s,c,x,y,h,t,id,open,cnt;
  for(s=0;s<N*N;s++)reg[s]=-1;
  function visit(n){if(!g[n]&&reg[n]<0){reg[n]=id;q[t++]=n;}}
  for(s=0;s<N*N;s++){
    if(g[s]||reg[s]>=0)continue;
    id=regions.length;h=0;t=0;open=false;cnt=0;
    reg[s]=id;q[t++]=s;
    while(h<t){
      c=q[h++];x=c%N;y=(c-x)/N;cnt++;
      if(x===0||y===0||x===N-1||y===N-1)open=true;
      if(x>0)visit(c-1);
      if(x<N-1)visit(c+1);
      if(y>0)visit(c-N);
      if(y<N-1)visit(c+N);
    }
    regions.push({id:id,open:open,count:cnt});
  }
  /* distance from the nearest wall (multi-source BFS), used to place the prompt text */
  var dist=new Int16Array(N*N),dq=new Int32Array(N*N),dh=0,dt=0,i;
  for(i=0;i<N*N;i++){if(g[i]){dist[i]=0;dq[dt++]=i;}else dist[i]=-1;}
  function dv(n,d){if(dist[n]<0){dist[n]=d;dq[dt++]=n;}}
  while(dh<dt){
    c=dq[dh++];x=c%N;
    if(x>0)dv(c-1,dist[c]+1);
    if(x<N-1)dv(c+1,dist[c]+1);
    if(c>=N)dv(c-N,dist[c]+1);
    if(c<N*N-N)dv(c+N,dist[c]+1);
  }
  var best=[];
  for(i=0;i<regions.length;i++)best.push(-1);
  for(i=0;i<N*N;i++){
    if(g[i])continue;
    var r=reg[i],d=dist[i]<0?0:dist[i];
    if(d>best[r]){best[r]=d;regions[r].ax=(i%N)*C+C/2;regions[r].ay=Math.floor(i/N)*C+C/2;}
  }
  return {reg:reg,regions:regions,dist:dist};
}

/* One SVG path (row spans) that tints a whole region. */
function tintPath(lab,id){
  var d='',x,y,x0,reg=lab.reg;
  for(y=0;y<N;y++){
    x=0;
    while(x<N){
      if(reg[y*N+x]!==id){x++;continue;}
      x0=x;while(x<N&&reg[y*N+x]===id)x++;
      d+='M'+x0*C+' '+y*C+'h'+(x-x0)*C+'v'+C+'h-'+(x-x0)*C+'z';
    }
  }
  return d;
}

/* Which region does a zone seed sit in? */
function zoneRegion(g,lab,z){
  if(z.x<0||z.y<0||z.x>W||z.y>H)return -1;
  var i=cellIdx(z.x,z.y);
  return g[i]?-1:lab.reg[i];
}

/* Everything the UI needs for step 1 (the nudge). */
function analyze(lines,zones){
  var g=rasterize(lines),lab=label(g),i,r,areas=[],info=[],type={},conflict={},seed={},unmarked=0;
  zones=zones||[];
  for(i=0;i<zones.length;i++){
    r=zoneRegion(g,lab,zones[i]);
    if(r<0){info.push({region:-1,stale:true,open:false});continue;}
    info.push({region:r,stale:false,open:lab.regions[r].open});
    if(type[r]&&type[r]!==zones[i].t)conflict[r]=true;
    type[r]=zones[i].t;
    if(!seed[r])seed[r]={x:zones[i].x,y:zones[i].y};
  }
  for(i=0;i<lab.regions.length;i++){
    r=lab.regions[i];
    if(r.open||r.count<MIN_CELLS)continue;
    if(!type[i])unmarked++;
    areas.push({id:i,x:r.ax,y:r.ay,count:r.count,type:type[i]||null,conflict:!!conflict[i]});
  }
  return {g:g,lab:lab,areas:areas,zoneInfo:info,unmarked:unmarked,type:type,conflict:conflict,seed:seed};
}

/* ---- corners ---- */
function angDeg(dx,dy){var a=Math.atan2(dy,dx)*180/Math.PI;return a<0?a+360:a;}

function corners(lines){
  var segs=[],i,j,l,verts={},list=[];
  for(i=0;i<lines.length;i++){
    l=lines[i];
    if(Math.hypot(l.x2-l.x1,l.y2-l.y1)>EPS)segs.push(l);
  }
  function addV(x,y){
    var key=Math.round(x*100)+','+Math.round(y*100);
    if(!verts[key]){verts[key]={x:x,y:y};list.push(verts[key]);}
  }
  for(i=0;i<segs.length;i++){addV(segs[i].x1,segs[i].y1);addV(segs[i].x2,segs[i].y2);}
  /* proper crossings (an X with no shared endpoint) */
  for(i=0;i<segs.length;i++){
    for(j=i+1;j<segs.length;j++){
      var a=segs[i],b=segs[j],rx=a.x2-a.x1,ry=a.y2-a.y1,sx=b.x2-b.x1,sy=b.y2-b.y1,den=rx*sy-ry*sx;
      if(Math.abs(den)<EPS)continue;
      var t=((b.x1-a.x1)*sy-(b.y1-a.y1)*sx)/den,u=((b.x1-a.x1)*ry-(b.y1-a.y1)*rx)/den;
      if(t>EPS&&t<1-EPS&&u>EPS&&u<1-EPS)addV(a.x1+t*rx,a.y1+t*ry);
    }
  }
  var out=[];
  list.forEach(function(v){
    var dirs=[];
    segs.forEach(function(s){
      var dx=s.x2-s.x1,dy=s.y2-s.y1,len2=dx*dx+dy*dy;
      var d1=Math.hypot(v.x-s.x1,v.y-s.y1),d2=Math.hypot(v.x-s.x2,v.y-s.y2);
      if(d1<1e-3){dirs.push(angDeg(dx,dy));return;}
      if(d2<1e-3){dirs.push(angDeg(-dx,-dy));return;}
      var t=((v.x-s.x1)*dx+(v.y-s.y1)*dy)/len2;
      if(t>0&&t<1&&Math.hypot(v.x-(s.x1+t*dx),v.y-(s.y1+t*dy))<1e-3){
        dirs.push(angDeg(dx,dy));dirs.push(angDeg(-dx,-dy));   // T-junction or crossing: wall runs through
      }
    });
    dirs.sort(function(p,q){return p-q;});
    var u=[];
    dirs.forEach(function(a){if(!u.length||a-u[u.length-1]>1)u.push(a);});
    if(u.length>1&&u[0]+360-u[u.length-1]<=1)u.pop();            // 359.5 and 0.2 are the same direction
    if(u.length<2)return;                                        // dead end: no corner
    for(var k=0;k<u.length;k++){
      var from=u[k],to=k+1<u.length?u[k+1]:u[0]+360,size=to-from;
      if(Math.abs(size-180)<1)continue;                          // straight wall
      out.push({x:v.x,y:v.y,bis:(from+size/2)%360,size:size});
    }
  });
  return out;
}

/* ---- coverage (cells of the same region inside the cone) ---- */
function cover(cam,lab,regId,fov,range){
  var out=[],r=Math.ceil(range/C)+1,cx=cellOf(cam.x),cy=cellOf(cam.y),x,y,px,py,d,a,diff;
  for(y=Math.max(0,cy-r);y<=Math.min(N-1,cy+r);y++){
    for(x=Math.max(0,cx-r);x<=Math.min(N-1,cx+r);x++){
      if(lab.reg[y*N+x]!==regId)continue;
      px=x*C+C/2-cam.x;py=y*C+C/2-cam.y;d=Math.hypot(px,py);
      if(d>range)continue;
      if(d>0){
        a=angDeg(px,py);diff=Math.abs(a-((cam.a%360)+360)%360);if(diff>180)diff=360-diff;
        if(diff>fov/2)continue;
      }
      out.push(y*N+x);
    }
  }
  return out;
}

/* Greedy pick: repeatedly take the candidate that covers the most cells not yet covered. */
function pickGreedy(pool,cap){
  var seen=new Uint8Array(N*N),out=[];
  while(out.length<cap&&pool.length){
    var bi=-1,bg=0;
    pool.forEach(function(c,i){
      var gain=0,k;for(k=0;k<c.cells.length;k++)if(!seen[c.cells[k]])gain++;
      if(gain>bg){bg=gain;bi=i;}
    });
    if(bi<0)break;
    pool[bi].cells.forEach(function(ci){seen[ci]=1;});
    out.push(pool[bi]);pool.splice(bi,1);
  }
  return out;
}

/* Last resort for an outdoor area with no usable corner: a spot next to the nearest wall, facing away
   from it. With no walls at all, the point the user marked. */
function wallFallback(g,lab,r,seed){
  var best=null,bd=1e9,x,y,dx,dy,vx,vy,any,nx,ny,px,py,d;
  for(y=0;y<N;y++){
    for(x=0;x<N;x++){
      if(g[y*N+x]||lab.reg[y*N+x]!==r)continue;
      vx=0;vy=0;any=false;
      for(dy=-1;dy<=1;dy++){
        for(dx=-1;dx<=1;dx++){
          if(!dx&&!dy)continue;
          nx=x+dx;ny=y+dy;
          if(nx<0||ny<0||nx>=N||ny>=N)continue;
          if(g[ny*N+nx]){vx-=dx;vy-=dy;any=true;}
        }
      }
      if(!any)continue;
      px=x*C+C/2;py=y*C+C/2;d=Math.hypot(px-seed.x,py-seed.y);
      if(d<bd){bd=d;best={x:px,y:py,a:Math.round(angDeg(vx,vy))};}
    }
  }
  if(!best)return {t:'out',x:seed.x,y:seed.y,a:90,r:r};
  return {t:'out',x:best.x,y:best.y,a:best.a,r:r};
}

/* ---- step 2: suggestions ----
   opts: {fov:deg, range:world units, cap:{in:n,out:n} (optional)} */
function suggest(lines,zones,opts){
  opts=opts||{};
  var fov=opts.fov||100,range=opts.range||120,A=analyze(lines,zones),g=A.g,lab=A.lab;
  var cs=corners(lines),cands=[],skippedMixed=0;
  cs.forEach(function(c){
    var rad=c.bis*Math.PI/180,cos=Math.cos(rad),sin=Math.sin(rad);
    var px=c.x+10*cos,py=c.y+10*sin;
    if(px<0||py<0||px>W||py>H)return;
    var pi=cellIdx(px,py);
    if(g[pi])return;                                             // wedge too narrow to probe
    var r=lab.reg[pi],t=A.type[r];
    if(!t)return;
    if(A.conflict[r]){skippedMixed++;return;}
    if(t==='in'&&c.size>=179)return;                             // indoor cameras sit in inner corners only
    var cam={t:t,x:+(c.x+8*cos).toFixed(1),y:+(c.y+8*sin).toFixed(1),a:Math.round(c.bis),r:r};
    cands.push({cam:cam,region:r,cells:cover(cam,lab,r,fov,range)});
  });
  /* A closed space gets at most MAX_ROOM cameras, chosen by how much new floor they cover.
     The outside (an open region) is not capped. */
  var byRegion={},kept=[],result=[];
  cands.forEach(function(c){(byRegion[c.region]=byRegion[c.region]||[]).push(c);});
  Object.keys(byRegion).forEach(function(r){
    var pool=byRegion[r];
    if(!lab.regions[r].open&&pool.length>MAX_ROOM)pool=pickGreedy(pool.slice(),MAX_ROOM);
    kept=kept.concat(pool);
  });
  ['in','out'].forEach(function(t){
    var pool=kept.filter(function(c){return c.cam.t===t;});
    var cap=opts.cap&&opts.cap[t]!==undefined?opts.cap[t]:Infinity;
    if(cap<pool.length)pool=pickGreedy(pool.slice(),cap);
    pool.forEach(function(c){result.push(c.cam);});
  });
  /* Every area marked Out gets at least one camera, even when the cart limit is used up. */
  Object.keys(A.type).forEach(function(k){
    var r=+k;
    if(A.type[r]!=='out'||A.conflict[r])return;
    if(!lab.regions[r].open&&lab.regions[r].count<MIN_CELLS)return;
    if(result.some(function(c){return c.t==='out'&&c.r===r;}))return;
    var pool=cands.filter(function(c){return c.region===r&&c.cam.t==='out';});
    var pick=pool.length?(pickGreedy(pool.slice(),1)[0]||pool[0]).cam:wallFallback(g,lab,r,A.seed[r]);
    result.push(pick);
  });
  return {cams:result,unmarked:A.unmarked,mixedAreas:skippedMixed,analysis:A};
}

return {rasterize:rasterize,label:label,tintPath:tintPath,analyze:analyze,corners:corners,suggest:suggest,N:N,C:C};
})();

var pendingOpen=null,SUG=null,sugHits=[];
function plural(n,w){return n+' '+w+(n===1?'':'s');}
/* Reads the cart saved by index.html (same origin, local storage only). Bullet = outdoor, as in index.html. */
function cartCounts(){
  try{
    var s=JSON.parse(localStorage.getItem('cameraPlanner.v3')||'null');
    if(!s||!s.carts)return null;
    var i=0,o=0;
    [s.sys,'wl'].forEach(function(k){
      var c=s.carts[k]||{};
      for(var id in c){var q=+c[id]||0;if(id==='bu')o+=q;else i+=q;}
    });
    return (i+o)?{'in':i,out:o}:null;
  }catch(_){return null;}
}
function sugCompute(){
  var cart=cartCounts(),cap,pi=0,po=0;
  if(cart){
    st.cams.forEach(function(c){if(c.t==='in')pi++;else po++;});
    cap={'in':Math.max(0,cart['in']-pi),out:Math.max(0,cart.out-po)};
  }
  var key=JSON.stringify([st.lines,st.zones,st.cams,fovVal(),+$('rng').value,cap||0]);
  if(SUG&&SUG.key===key)return SUG;
  var res=Sug.suggest(st.lines,st.zones,{fov:fovVal(),range:BASE_R*rngScale(),cap:cap});
  res.cams=res.cams.filter(function(g){
    return !st.cams.some(function(c){return Math.hypot(c.x-g.x,c.y-g.y)<12;});
  });
  SUG={key:key,res:res,A:res.analysis,cart:cart,cap:cap};
  return SUG;
}
function chipGroup(x,y){
  return mk('g',{'data-ax':x,'data-ay':y,transform:'translate('+x+' '+y+') scale('+(1/view.s).toFixed(4)+')'});
}
function chip(g,x0,x1,label,col){
  g.appendChild(mk('rect',{x:x0,y:-14,width:x1-x0,height:36,rx:8,style:'fill:var(--surface-2);stroke:'+col+';stroke-width:2'}));
  var t=mk('text',{x:(x0+x1)/2,y:4,'text-anchor':'middle','dominant-baseline':'central',style:'fill:var(--text-primary);font-size:14px;font-weight:600'});
  t.textContent=label;g.appendChild(t);
}
function promptText(g,s){
  var t=mk('text',{x:0,y:-26,'text-anchor':'middle',style:'fill:var(--text-primary);font-size:13px;font-weight:600;paint-order:stroke;stroke:var(--surface-2);stroke-width:4px'});
  t.textContent=s;g.appendChild(t);
}
function promptChips(g){chip(g,-82,-4,'In',IN);chip(g,4,82,'Out',OUT);}
function rescaleSug(){
  var g=$('cSug').children,k=(1/view.s).toFixed(4),i,e;
  for(i=0;i<g.length;i++){
    e=g[i];
    if(e.hasAttribute('data-ax'))e.setAttribute('transform','translate('+e.getAttribute('data-ax')+' '+e.getAttribute('data-ay')+') scale('+k+')');
  }
}
function renderSuggestLayer(){
  $('sugbar').hidden=tool!=='suggest';
  if(tool!=='suggest')return;
  var S=sugCompute(),A=S.A,zl=$('cZones'),sg=$('cSug'),marks={},openMarks=0,mixed=0;
  sugHits=[];
  st.zones.forEach(function(z,i){
    var zi=A.zoneInfo[i];if(zi.stale)return;
    var m=marks[zi.region];
    if(!m)marks[zi.region]={id:zi.region,t:z.t,x:z.x,y:z.y,open:zi.open};else m.t=z.t;
  });
  /* ghost cameras first, so chips stay on top */
  S.res.cams.forEach(function(c){
    var col=c.t==='in'?IN:OUT,rad=c.a*Math.PI/180;
    sg.appendChild(mk('line',{x1:c.x,y1:c.y,x2:c.x+Math.cos(rad)*(PR+10),y2:c.y+Math.sin(rad)*(PR+10),style:'stroke:'+col+';stroke-width:3;stroke-linecap:round'}));
    sg.appendChild(mk('circle',{cx:c.x,cy:c.y,r:PR,style:'fill:'+col+';fill-opacity:.25;stroke:'+col+';stroke-width:2;stroke-dasharray:4 3'}));
  });
  Object.keys(marks).forEach(function(key){
    var m=marks[key],col=m.t==='in'?IN:OUT,ar=null,id=+key;
    A.areas.forEach(function(a){if(a.id===id)ar=a;});
    zl.appendChild(mk('path',{d:Sug.tintPath(A.lab,id),style:'fill:'+col+';fill-opacity:.16'}));
    var px=ar?ar.x:m.x,py=ar?ar.y:m.y,g=chipGroup(px,py),mx=A.conflict[id];
    if(m.open)openMarks++;
    if(mx)mixed++;
    chip(g,-62,62,(mx?'Mixed':(m.t==='in'?'In':'Out'))+(m.open?' ⚠':''),col);
    sg.appendChild(g);
    sugHits.push({k:'mark',x:px,y:py,id:id,t:m.t});
  });
  A.areas.forEach(function(a){
    if(a.type)return;
    var g=chipGroup(a.x,a.y);
    promptText(g,'In or out?');promptChips(g);
    sg.appendChild(g);
    sugHits.push({k:'prompt',x:a.x,y:a.y,id:a.id});
  });
  if(pendingOpen){
    var pg=chipGroup(pendingOpen.x,pendingOpen.y);
    pg.appendChild(mk('circle',{cx:0,cy:0,r:4,style:'fill:var(--accent)'}));
    promptText(pg,'Mark this open area');promptChips(pg);
    sg.appendChild(pg);
    sugHits.push({k:'pend',x:pendingOpen.x,y:pendingOpen.y});
  }
  /* status bar */
  var cams=S.res.cams,ni=0,no=0,stale=0,msg=[],nm=Object.keys(marks).length;
  cams.forEach(function(c){if(c.t==='in')ni++;else no++;});
  A.zoneInfo.forEach(function(z){if(z.stale)stale++;});
  if(pendingOpen)msg.push('This area is open to the edge. Close the doorway with a line, or mark it anyway.');
  else if(!A.areas.length&&!nm)msg.push('No closed areas found yet. Close your walls with lines, or tap an empty spot outside to mark the outside.');
  else if(!nm)msg.push('Tap In or Out in each area. To mark the outside, tap an empty spot outside the walls, then Out.');
  if(A.unmarked&&nm)msg.push(plural(A.unmarked,'area')+' not marked, no cameras suggested there.');
  if(openMarks&&!pendingOpen)msg.push(plural(openMarks,'marked area')+' open to the edge (⚠). Close the doorway with a line, or keep it as marked.');
  if(stale)msg.push(plural(stale,'mark')+' no longer sit in an area because the walls changed. Use Clear marks to remove them.');
  if(mixed)msg.push('An area has both indoor and outdoor marks. Tap its label to reset it.');
  if(nm)msg.push(cams.length?'Suggested: '+ni+' indoor, '+no+' outdoor (dashed), at most 3 per closed space. Tap one to place it.':'No new corners to suggest in the marked areas.');
  if(S.cart)msg.push('Your cart has '+S.cart['in']+' indoor, '+S.cart.out+' outdoor, so suggestions are limited to what is left of that.');
  if(S.cart&&S.cap&&no>S.cap.out)msg.push('An area marked Out always gets at least one outdoor camera, even if that is more than your cart has left.');
  $('sugMsg').textContent=msg.join(' ');
  $('sugPlace').textContent='Place all ('+cams.length+')';
  $('sugPlace').disabled=!cams.length;
  $('sugClear').disabled=!st.zones.length;
}
function setRegion(h,t){
  var A=sugCompute().A;
  pushUndo();
  if(h.k==='pend'){
    st.zones.push({x:Math.round(h.x*10)/10,y:Math.round(h.y*10)/10,t:t});
  }else{
    st.zones=st.zones.filter(function(z,i){return A.zoneInfo[i].region!==h.id;});
    if(t)st.zones.push({x:h.x,y:h.y,t:t});
  }
  pendingOpen=null;
}
function inChip(lx,ly,x0,x1){return lx>=x0-6&&lx<=x1+6&&ly>=-20&&ly<=28;}
function sugTap(p){
  var S=sugCompute(),A=S.A,k=1/view.s,i,h,lx,ly;
  for(i=0;i<sugHits.length;i++){
    h=sugHits[i];lx=(p.x-h.x)*view.s;ly=(p.y-h.y)*view.s;
    if(h.k==='mark'){
      if(inChip(lx,ly,-62,62)){setRegion(h,h.t==='in'?'out':(h.t==='out'?null:'in'));return;}
    }else{
      if(inChip(lx,ly,-82,-4)){setRegion(h,'in');return;}
      if(inChip(lx,ly,4,82)){setRegion(h,'out');return;}
    }
  }
  for(i=0;i<S.res.cams.length;i++){
    var c=S.res.cams[i];
    if(Math.hypot(p.x-c.x,p.y-c.y)<=PR+14*k){pushUndo();st.cams.push({t:c.t,x:c.x,y:c.y,a:c.a});return;}
  }
  /* empty spot: offer to mark an open (outside) area */
  if(p.x<0||p.y<0||p.x>=W||p.y>=H){pendingOpen=null;return;}
  var N=Sug.N,C=Sug.C,ci=Math.min(N-1,Math.floor(p.y/C))*N+Math.min(N-1,Math.floor(p.x/C));
  if(A.g[ci]){pendingOpen=null;return;}
  var r=A.lab.reg[ci];
  if(!A.lab.regions[r].open||A.type[r]){pendingOpen=null;return;}
  pendingOpen={x:p.x,y:p.y};
}
$('sugPlace').onclick=function(){
  var cams=sugCompute().res.cams;
  if(!cams.length)return;
  pushUndo();
  cams.forEach(function(c){st.cams.push({t:c.t,x:c.x,y:c.y,a:c.a});});
  renderCustom();updButtons();
  say('Placed '+plural(cams.length,'camera')+'. Undo reverts them all.');
};
$('sugClear').onclick=function(){
  if(!st.zones.length)return;
  pushUndo();st.zones=[];pendingOpen=null;
  renderCustom();updButtons();
};

/* Aim and Erase need something to act on; the Field of view and Range sliders need a camera (Your plan view only). */
function updToolState(){
  var hasCams=st.cams.length>0,empty=!(st.lines.length||st.texts.length||st.cams.length);
  var aim=document.querySelector('[data-tool="aim"]'),er=document.querySelector('[data-tool="erase"]');
  aim.disabled=!hasCams;er.disabled=empty;
  aim.title=hasCams?'':'Place a camera first';er.title=empty?'':'';
  if(empty)er.title='Nothing to erase yet';
  var custom=!$('viewCustom').hidden;
  $('fov').disabled=$('rng').disabled=custom&&!hasCams;
  $('fov').title=$('rng').title=($('fov').disabled?'Place a camera first':'');
  if((tool==='aim'&&!hasCams)||(tool==='erase'&&empty)){
    document.querySelector('[data-tool="line"]').click();
    say(tool==='line'?'Switched to Line: nothing left to '+(empty?'erase':'aim')+'.':'');
  }
}

/* Hit testing (world coords; tolerances scaled to screen) */
function hit(p){
  var k=1/view.s,i;
  for(i=st.cams.length-1;i>=0;i--){
    var c=st.cams[i];
    if(Math.hypot(p.x-c.x,p.y-c.y)<=PR+8*k)return {k:'cams',i:i};
  }
  for(i=st.texts.length-1;i>=0;i--){
    var t=st.texts[i],w=t.t.length*8;
    if(p.x>=t.x-6*k&&p.x<=t.x+w+6*k&&p.y>=t.y-14-6*k&&p.y<=t.y+4+6*k)return {k:'texts',i:i};
  }
  for(i=st.lines.length-1;i>=0;i--){
    var l=st.lines[i];
    if(segDist(p,l)<=10*k)return {k:'lines',i:i};
  }
  return null;
}
function hitCam(p){
  var k=1/view.s,best=null,bd=1e9;
  st.cams.forEach(function(c){
    var d=Math.hypot(p.x-c.x,p.y-c.y);
    if(d<=PR+14*k&&d<bd){bd=d;best=c;}
  });
  return best;
}
function segDist(p,l){
  var dx=l.x2-l.x1,dy=l.y2-l.y1,len2=dx*dx+dy*dy;
  var t=len2?clamp(((p.x-l.x1)*dx+(p.y-l.y1)*dy)/len2,0,1):0;
  return Math.hypot(p.x-(l.x1+t*dx),p.y-(l.y1+t*dy));
}

/* Text entry */
function setPending(p){
  pending={x:snap(p.x,W),y:snap(p.y,H)};
  $('textbar').hidden=false;
  $('textInput').value='';
  renderCustom();
  $('textInput').focus();
}
function cancelPending(){
  pending=null;
  $('textbar').hidden=true;
  $('textInput').blur();
  renderCustom();
}
function commitText(){
  var v=$('textInput').value.trim();
  if(!pending||!v){cancelPending();return;}
  pushUndo();
  st.texts.push({x:pending.x,y:pending.y,t:v});
  cancelPending();
  updButtons();
}

/* Pointer handling: one finger uses the tool, two fingers pinch / pan */
var ptrs={},gest=null,act=null;

function startGesture(){
  var ids=Object.keys(ptrs);
  var a=ptrs[ids[0]],b=ptrs[ids[1]];
  var r=cv.getBoundingClientRect();
  var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  gest={
    d0:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),
    v0:{s:view.s,x:view.x,y:view.y},
    wx:((mx-r.left)-view.x)/view.s,
    wy:((my-r.top)-view.y)/view.s,
    ids:[ids[0],ids[1]]
  };
}
function updateGesture(){
  var a=ptrs[gest.ids[0]],b=ptrs[gest.ids[1]];
  if(!a||!b)return;
  var r=cv.getBoundingClientRect();
  var mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;
  var d=Math.hypot(a.x-b.x,a.y-b.y);
  var s=clamp(gest.v0.s*d/gest.d0,0.3,8);
  view.s=s;view.x=mx-gest.wx*s;view.y=my-gest.wy*s;
  viewTouched=true;
  applyView();
}

cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(Object.keys(ptrs).length>=2){
    if(!gest)startGesture();
    act=null;draft=null;renderCustom();
    return;
  }
  var p=toWorld(e.clientX,e.clientY);
  act={id:e.pointerId,sx:e.clientX,sy:e.clientY,moved:false,tool:tool,p:p,pushed:false};
  if(tool==='line'){
    var sx=snap(p.x,W),sy=snap(p.y,H);
    draft={x1:sx,y1:sy,x2:sx,y2:sy};
  }else if(tool==='pan'){
    act.vx=view.x;act.vy=view.y;
  }else if(tool==='aim'){
    act.cam=hitCam(p);
    if(act.cam)act.a0=act.cam.a;
  }
  renderCustom();
});

cv.addEventListener('pointermove',function(e){
  if(!ptrs[e.pointerId])return;
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(gest){updateGesture();return;}
  if(!act||act.id!==e.pointerId)return;
  var dist=Math.hypot(e.clientX-act.sx,e.clientY-act.sy);
  if(dist>8)act.moved=true;
  var p=toWorld(e.clientX,e.clientY);
  if(act.tool==='line'&&draft){
    draft.x2=snap(p.x,W);draft.y2=snap(p.y,H);
    renderCustom();
  }else if(act.tool==='pan'){
    view.x=act.vx+(e.clientX-act.sx);
    view.y=act.vy+(e.clientY-act.sy);
    viewTouched=true;
    applyView();
  }else if(act.tool==='aim'&&act.cam&&act.moved){
    if(!act.pushed){
      // snapshot with the aim as it was before this drag
      var keep=act.cam.a;act.cam.a=act.a0!==undefined?act.a0:keep;
      pushUndo();act.cam.a=keep;act.pushed=true;
    }
    act.cam.a=Math.round(Math.atan2(p.y-act.cam.y,p.x-act.cam.x)*180/Math.PI);
    renderCustom();
  }
});

function endPointer(e,cancelled){
  if(!ptrs[e.pointerId])return;
  delete ptrs[e.pointerId];
  if(gest){
    if(Object.keys(ptrs).length<2)gest=null;
    act=null;draft=null;renderCustom();
    return;
  }
  if(!act||act.id!==e.pointerId)return;
  var a=act;act=null;
  if(cancelled){draft=null;renderCustom();return;}
  if(a.tool==='line'){
    if(draft&&(draft.x1!==draft.x2||draft.y1!==draft.y2)){
      pushUndo();
      st.lines.push({x1:draft.x1,y1:draft.y1,x2:draft.x2,y2:draft.y2});
    }
    draft=null;
  }else if(!a.moved){
    if(a.tool==='in'||a.tool==='out'){
      pushUndo();
      st.cams.push({t:a.tool,x:snap(a.p.x,W),y:snap(a.p.y,H),a:90});
    }else if(a.tool==='text'){
      setPending(a.p);
    }else if(a.tool==='suggest'){
      sugTap(a.p);
    }else if(a.tool==='erase'){
      var h=hit(a.p);
      if(h){pushUndo();st[h.k].splice(h.i,1);}
    }
  }
  renderCustom();updButtons();
}
cv.addEventListener('pointerup',function(e){endPointer(e,false);});
cv.addEventListener('pointercancel',function(e){endPointer(e,true);});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});

/* Mouse wheel zoom for desktop testing */
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  var r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  var wx=(mx-view.x)/view.s,wy=(my-view.y)/view.s;
  var s=clamp(view.s*(e.deltaY<0?1.1:1/1.1),0.3,8);
  view.s=s;view.x=mx-wx*s;view.y=my-wy*s;
  viewTouched=true;applyView();
},{passive:false});

/* Toolbar */
Array.prototype.forEach.call(document.querySelectorAll('[data-tool]'),function(b){
  b.addEventListener('click',function(){
    tool=b.getAttribute('data-tool');
    Array.prototype.forEach.call(document.querySelectorAll('[data-tool]'),function(x){
      x.setAttribute('aria-pressed',x===b?'true':'false');
    });
    draft=null;
    pendingOpen=null;
    if(tool!=='text')cancelPending();
    setHint();renderCustom();
  });
});
$('btnUndo').onclick=doUndo;
$('btnRedo').onclick=doRedo;
$('btnClear').onclick=function(){
  if(!(st.lines.length||st.texts.length||st.cams.length||st.zones.length))return;
  pushUndo();
  st={lines:[],texts:[],cams:[],zones:[]};
  cancelPending();renderCustom();updButtons();
};
$('btnFit').onclick=function(){viewTouched=false;fitView();};
$('textAdd').onclick=commitText;
$('textCancel').onclick=cancelPending;
$('textInput').addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();commitText();}
});
$('showCones').addEventListener('change',function(){renderCustom();schedulePersist();});

/* ================= SAVE / LOAD ================= */
var KEY='flatCameraPlan.v1',saveTimer=null,statusTimer=null;
function say(msg){
  var s=$('status');s.textContent=msg;
  clearTimeout(statusTimer);
  statusTimer=setTimeout(function(){s.textContent='';},4000);
}
function num(v,lo,hi,def){
  v=Number(v);
  return isFinite(v)?clamp(v,lo,hi):def;
}
function sanitize(d){
  if(!d||typeof d!=='object')return null;
  var out={lines:[],texts:[],cams:[],zones:[]};
  (Array.isArray(d.lines)?d.lines:[]).slice(0,2000).forEach(function(l){
    if(!l)return;
    out.lines.push({x1:num(l.x1,0,W,0),y1:num(l.y1,0,H,0),x2:num(l.x2,0,W,0),y2:num(l.y2,0,H,0)});
  });
  (Array.isArray(d.texts)?d.texts:[]).slice(0,500).forEach(function(t){
    if(!t||typeof t.t!=='string')return;
    var s=t.t.trim().slice(0,40);
    if(s)out.texts.push({x:num(t.x,0,W,0),y:num(t.y,0,H,0),t:s});
  });
  (Array.isArray(d.cams)?d.cams:[]).slice(0,200).forEach(function(c){
    if(!c)return;
    out.cams.push({t:c.t==='out'?'out':'in',x:num(c.x,0,W,0),y:num(c.y,0,H,0),a:num(c.a,-360,360,90)});
  });
  (Array.isArray(d.zones)?d.zones:[]).slice(0,200).forEach(function(z){
    if(!z)return;
    out.zones.push({t:z.t==='out'?'out':'in',x:num(z.x,0,W,0),y:num(z.y,0,H,0)});
  });
  var sv=d.settings||{};
  out.settings={
    showCones:sv.showCones===true,
    fov:num(sv.fov,60,130,100),
    rng:num(sv.rng,60,160,100)
  };
  return out;
}
function snapshotData(){
  return {
    app:'flat-camera-coverage',version:2,
    lines:st.lines,texts:st.texts,cams:st.cams,zones:st.zones,
    settings:{showCones:$('showCones').checked,fov:fovVal(),rng:+$('rng').value}
  };
}
function applyData(d){
  st={lines:d.lines,texts:d.texts,cams:d.cams,zones:d.zones||[]};
  $('showCones').checked=d.settings.showCones;
  $('fov').value=d.settings.fov;
  $('rng').value=d.settings.rng;
  cancelPending();
  onSlide();updButtons();
}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(snapshotData()));}catch(_){}
}
function schedulePersist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(persist,200);
}
function restore(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return;
    var d=sanitize(JSON.parse(raw));
    if(d)applyData(d);
  }catch(_){}
}
window.addEventListener('pagehide',persist);
document.addEventListener('visibilitychange',function(){if(document.hidden)persist();});

$('btnSave').onclick=function(){
  try{
    var blob=new Blob([JSON.stringify(snapshotData(),null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    var d=new Date(),p=function(n){return (n<10?'0':'')+n;};
    a.href=url;
    a.download='my-floor-plan-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},2000);
    say('Plan saved to your Downloads.');
  }catch(_){say('Could not save the file.');}
};
$('btnLoad').onclick=function(){$('fileIn').value='';$('fileIn').click();};
$('fileIn').addEventListener('change',function(){
  var f=this.files&&this.files[0];
  if(!f)return;
  if(f.size>2*1024*1024){say('That file is too large to be a plan.');return;}
  var rd=new FileReader();
  rd.onerror=function(){say('Could not read that file.');};
  rd.onload=function(){
    var d=null,raw=null;
    try{raw=JSON.parse(rd.result);d=sanitize(raw);}catch(_){}
    if(!d||!(Array.isArray(raw.lines)||Array.isArray(raw.texts)||Array.isArray(raw.cams))){
      say('That file is not a valid plan.');return;
    }
    var has=st.lines.length||st.texts.length||st.cams.length||st.zones.length;
    if(has&&!window.confirm('Replace your current plan with this file? You can still tap Undo afterwards.'))return;
    pushUndo();
    applyData(d);
    say('Plan loaded.');
  };
  rd.readAsText(f);
});

/* ================= SWITCH & SHARED ================= */
function showView(custom){
  $('viewExample').hidden=custom;
  $('viewCustom').hidden=!custom;
  $('swExample').setAttribute('aria-pressed',custom?'false':'true');
  $('swCustom').setAttribute('aria-pressed',custom?'true':'false');
  if(custom){
    if(!viewTouched)fitView();
    renderCustom();
  }else{
    cancelPending();
  }
  updToolState();
  window.scrollTo(0,0);
}
$('swExample').onclick=function(){showView(false);};
$('swCustom').onclick=function(){showView(true);};
$('tryBtn').onclick=function(){showView(true);};

function onSlide(){
  $('fovo').textContent=fovVal()+'°';
  $('rngo').textContent=Math.round(rngScale()*100)+'%';
  drawExample();
  if(!$('viewCustom').hidden)renderCustom();
  schedulePersist();
}
$('fov').addEventListener('input',onSlide);
$('rng').addEventListener('input',onSlide);

window.addEventListener('resize',function(){
  if(!$('viewCustom').hidden&&!viewTouched)fitView();
});

buildExample();
restore();
onSlide();
setHint();
updButtons();
})();
</script>
